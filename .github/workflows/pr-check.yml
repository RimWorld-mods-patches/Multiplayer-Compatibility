name: Validate Pull Request

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read

on:
  pull_request:
  workflow_call:
    outputs:
      zip_name:
        description: Filename of the uploaded mod ZIP.
        value: ${{ jobs.package-mod.outputs.zip_name }}

concurrency:
  # Use a separate group when the integration workflow calls these jobs.
  group: mpcompat-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build mod (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore Multiplayer_Compat.sln

      - name: Build mod
        run: dotnet build Multiplayer_Compat.sln --configuration ${{ matrix.configuration }} --no-restore

  format-check:
    name: Code formatting (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore Multiplayer_Compat.sln

      - name: Check code formatting
        continue-on-error: true
        run: dotnet format Multiplayer_Compat.sln --verify-no-changes --no-restore

  package-mod:
    name: Package mod for testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      zip_name: ${{ steps.package.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build and package mod (Release)
        id: package
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./release_bundler.sh
          short_sha=$(git rev-parse --short HEAD)
          if [[ -n "$PR_NUMBER" ]]; then
            stamp="pr${PR_NUMBER}-${short_sha}"
          else
            stamp="integration.$(date -u +%Y%m%d)+${short_sha}"
          fi
          package="Multiplayer-Compatibility-${stamp}.zip"
          mv Multiplayer-Compatibility.zip "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Upload mod ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error
          overwrite: true
